<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Nini Garments | Product</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f5f7fb;color:#172033}button,input,select{font:inherit;cursor:pointer}.header{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid #e7eaf0;padding:12px 5%;display:flex;align-items:center;gap:24px}.logo{width:120px;height:58px;object-fit:contain}.search{flex:1;display:flex;max-width:620px}.search input{width:100%;padding:12px 14px;border:1px solid #d8deea;border-radius:8px 0 0 8px}.search button{padding:0 18px;border:0;background:#2167ed;color:#fff;border-radius:0 8px 8px 0;font-weight:700}.nav{margin-left:auto;display:flex;gap:18px;align-items:center;white-space:nowrap}.nav a,.nav button{border:0;background:none;text-decoration:none;color:#172033;font-weight:700}.badge{background:#ff2d68;color:#fff;border-radius:999px;padding:2px 7px;font-size:11px;margin-left:3px}.page{max-width:1250px;margin:24px auto;padding:0 18px}.crumb{font-size:13px;color:#68748b;margin-bottom:16px}.product-main{background:#fff;border-radius:16px;padding:24px;display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:34px;box-shadow:0 4px 20px rgba(0,0,0,.06)}.gallery{display:flex;align-items:flex-start;justify-content:center;background:#fafbfc;border-radius:14px;min-height:560px;padding:20px}.gallery img{width:100%;max-height:540px;object-fit:contain}.info h1{font-size:30px;margin:0 0 12px}.rating{display:inline-flex;align-items:center;gap:7px;background:#147a3d;color:#fff;border-radius:5px;padding:6px 9px;font-weight:800;font-size:13px}.muted{color:#68748b}.price{font-size:32px;font-weight:900;margin:20px 0 5px}.mrp{text-decoration:line-through;color:#788397;font-size:17px;margin-left:10px;font-weight:500}.off{color:#16833b;font-size:16px;font-weight:800;margin-left:10px}.meta{display:grid;grid-template-columns:120px 1fr;gap:10px;margin:18px 0;color:#4d596d}.size-title{font-weight:800;margin-top:20px}.sizes{display:flex;flex-wrap:wrap;gap:9px;margin-top:10px}.size-btn{background:#fff;border:1px solid #cbd3e0;border-radius:7px;padding:10px 14px}.size-btn.active{border:2px solid #2167ed;background:#eef4ff}.qty{display:flex;align-items:center;gap:12px;margin:16px 0}.qty button{width:38px;height:38px;border:1px solid #ccd4e2;background:#fff;border-radius:7px;font-size:20px}.qty span{font-weight:800;min-width:25px;text-align:center}.actions{display:grid;grid-template-columns:1fr 1fr;gap:12px}.btn{padding:14px;border-radius:8px;font-weight:800;border:1px solid #172033}.cart{background:#2167ed;color:#fff;border-color:#2167ed}.buy{background:#fff;color:#172033}.wish{margin-top:12px;width:100%;padding:11px;background:#fff;border:1px solid #d7ddea;border-radius:8px;font-weight:800}.section{background:#fff;border-radius:16px;padding:24px;margin-top:20px;box-shadow:0 4px 20px rgba(0,0,0,.05)}.section h2{margin:0 0 14px}.review-box{border:1px solid #e1e6ef;border-radius:12px;padding:18px;background:#fafbfc}.related{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}.card{border:1px solid #e1e6ef;border-radius:12px;overflow:hidden;background:#fff}.card img{width:100%;height:220px;object-fit:cover;background:#f5f6f8}.card-body{padding:13px}.card h3{font-size:16px;margin:0 0 7px}.card-price{font-weight:900;font-size:18px}.card del{font-size:13px;color:#7b8494;margin-left:5px}.card button{margin-top:10px;width:100%;padding:9px;border:1px solid #2167ed;color:#2167ed;background:#fff;border-radius:7px;font-weight:700}.loading{text-align:center;padding:80px;font-weight:700}.error{text-align:center;background:#fff;padding:40px;border-radius:14px}.back{display:inline-block;margin-bottom:14px;color:#2167ed;text-decoration:none;font-weight:700}@media(max-width:850px){.header{flex-wrap:wrap;padding:10px 14px;gap:10px}.logo{width:95px;height:48px}.search{order:3;max-width:none;width:100%}.nav{margin-left:auto;gap:10px;font-size:13px}.product-main{grid-template-columns:1fr;padding:15px;gap:20px}.gallery{min-height:360px}.gallery img{max-height:380px}.info h1{font-size:24px}.price{font-size:28px}.related{grid-template-columns:repeat(2,1fr)}}@media(max-width:480px){.related{grid-template-columns:1fr 1fr}.card img{height:170px}.actions{grid-template-columns:1fr}.meta{grid-template-columns:100px 1fr}}
</style>
</head>
<body>
<header class="header">
  <a href="index.html#shop"><img class="logo" src="nini-logo.jpeg" alt="Nini Garments"></a>
  <div class="search"><input id="search" placeholder="Search products..."><button onclick="searchProducts()">Search</button></div>
  <nav class="nav"><a href="index.html#shop">Shop</a><button onclick="openWishlist()">♡ Wishlist <span id="wishCount" class="badge">0</span></button><a href="index.html#cart">🛒 Cart <span id="cartCount" class="badge">0</span></a><a href="index.html#orders">My Orders</a></nav>
</header>
<main class="page"><a class="back" href="index.html#shop">← Back to Shop</a><div id="app" class="loading">Loading product...</div></main>
<script>
const API_URL="https://nini-api.msninigarments7368.workers.dev";
let products=[];let product=null;let selectedSize="";let quantity=1;
let wishlist=JSON.parse(localStorage.getItem("niniWishlist")||"[]");
let cart=JSON.parse(localStorage.getItem("niniCart")||"[]");
const esc=v=>String(v??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;");
function price(p,s){const x=p.sizes?.find(v=>String(v.size)===String(s));return Number(x?.price??p.price??0)}
function mrp(p,s){const x=p.sizes?.find(v=>String(v.size)===String(s));return Number(x?.mrp??p.mrp??price(p,s))}
function discount(p,s){const a=mrp(p,s),b=price(p,s);return a>b?Math.round((a-b)/a*100):0}
function inStock(p){return (p.sizes||[]).filter(s=>Number(s.stock||0)>0)}
function lowest(p){const a=inStock(p).map(s=>price(p,s.size)).filter(x=>x>0);return a.length?Math.min(...a):Number(p.price||0)}
function updateCounts(){document.getElementById("wishCount").textContent=wishlist.length;document.getElementById("cartCount").textContent=cart.reduce((a,x)=>a+Number(x.quantity||0),0)}
function toggleWish(){const id=Number(product.id);if(wishlist.includes(id))wishlist=wishlist.filter(x=>x!==id);else wishlist.push(id);localStorage.setItem("niniWishlist",JSON.stringify(wishlist));render();updateCounts()}
function openWishlist(){alert("Wishlist is available on the Shop page. Your saved products are preserved.");}
function chooseSize(s){selectedSize=s;quantity=1;render();}
function changeQty(n){const s=product?.sizes?.find(x=>String(x.size)===String(selectedSize));const max=Number(s?.stock||1);quantity=Math.min(max,Math.max(1,quantity+n));document.getElementById("qty").textContent=quantity}
function addCart(buyNow=false){if(!selectedSize){alert("Please select a size first.");return}const s=product.sizes.find(x=>String(x.size)===String(selectedSize));if(!s||Number(s.stock)<=0){alert("This size is out of stock.");return}const p=price(product,selectedSize),m=mrp(product,selectedSize),d=discount(product,selectedSize);const old=cart.find(x=>Number(x.id)===Number(product.id)&&String(x.size)===String(selectedSize));if(old){if(Number(old.quantity)+quantity>Number(s.stock)){alert("No more stock available for this size.");return}old.quantity+=quantity;old.price=p;old.mrp=m;old.discount=d}else cart.push({id:product.id,name:product.name,category:product.category,price:p,mrp:m,discount:d,size:selectedSize,quantity,image:product.image});localStorage.setItem("niniCart",JSON.stringify(cart));updateCounts();if(buyNow){window.location.href="index.html?checkout=1#cart"}else alert(product.name+" added to cart.")}
function searchProducts(){const q=document.getElementById("search").value.trim();window.location.href="index.html#shop"+(q?"?search="+encodeURIComponent(q):"")}
function relatedCard(p){const ps=lowest(p),ss=inStock(p);const size=ss[0]?.size||"";return `<div class="card"><img src="${esc(p.image||"nini-logo.jpeg")}" alt="${esc(p.name)}" onerror="this.src='nini-logo.jpeg'"><div class="card-body"><h3>${esc(p.name)}</h3><div class="card-price">₹${ps.toLocaleString("en-IN")}${size&&mrp(p,size)>ps?` <del>₹${mrp(p,size).toLocaleString("en-IN")}</del>`:""}</div><button onclick="window.location.href='product.html?id=${Number(p.id)}'">View Product</button></div></div>`}
function render(){if(!product)return;const sizes=inStock(product);const has=!!selectedSize;const s=sizes.find(x=>String(x.size)===String(selectedSize));const p=has?price(product,selectedSize):lowest(product);const m=has?mrp(product,selectedSize):(()=>{const vals=sizes.map(x=>mrp(product,x.size)).filter(x=>x>0);return vals.length?Math.min(...vals):Number(product.mrp||p)})();const d=m>p?Math.round((m-p)/m*100):0;const wished=wishlist.includes(Number(product.id));document.getElementById("app").innerHTML=`<div class="crumb">Home / ${esc(product.category||"Products")} / ${esc(product.name)}</div><section class="product-main"><div class="gallery"><img src="${esc(product.image||"nini-logo.jpeg")}" alt="${esc(product.name)}" onerror="this.src='nini-logo.jpeg'"></div><div class="info"><h1>${esc(product.name)}</h1><div><span class="rating">⭐ 4.5 ★</span> <span class="muted">No reviews yet</span></div><div class="price">₹${p.toLocaleString("en-IN")}${m>p?`<del class="mrp">₹${m.toLocaleString("en-IN")}</del><span class="off">${d}% OFF</span>`:""}</div><div class="meta">${product.category?`<div>Category</div><div>${esc(product.category)}</div>`:""}${product.age_group?`<div>Age Group</div><div>${esc(product.age_group)}</div>`:""}${product.sku?`<div>SKU</div><div>${esc(product.sku)}</div>`:""}</div><div class="size-title">Select Size</div><div class="sizes">${sizes.length?sizes.map(x=>`<button class="size-btn ${String(x.size)===String(selectedSize)?"active":""}" onclick="chooseSize('${esc(x.size)}')">${esc(x.size)}<br><small>${Number(x.stock)} left</small></button>`).join(""):"<span class='muted'>Out of stock</span>"}</div>${s?`<div class="muted" style="margin-top:8px">✓ ${Number(s.stock)} in stock · ₹${price(product,selectedSize).toLocaleString("en-IN")} for selected size</div>`:""}<div class="qty"><strong>Quantity</strong><button onclick="changeQty(-1)">−</button><span id="qty">${quantity}</span><button onclick="changeQty(1)">+</button></div><div class="actions"><button class="btn cart" onclick="addCart(false)">🛒 Add to Cart</button><button class="btn buy" onclick="addCart(true)">⚡ Buy Now</button></div><button class="wish" onclick="toggleWish()">${wished?"♥ Remove from Wishlist":"♡ Add to Wishlist"}</button></div></section><section class="section"><h2>Product Details</h2><p style="line-height:1.75;color:#4b5563">${product.description?esc(product.description):"Product description will be available soon."}</p>${product.tags?`<p><strong>Tags:</strong> <span class="muted">${esc(product.tags)}</span></p>`:""}</section><section class="section"><h2>Ratings & Reviews</h2><div class="review-box"><strong>⭐ Customer Rating</strong><p class="muted">No customer reviews yet. Reviews will appear here after customers start reviewing this product.</p></div></section><section class="section"><h2>Related Products</h2><div class="related" id="related"></div></section>`;const rel=products.filter(x=>Number(x.id)!==Number(product.id)&&String(x.category||"").toLowerCase()===String(product.category||"").toLowerCase()).slice(0,4);const finalRel=rel.length?rel:products.filter(x=>Number(x.id)!==Number(product.id)).slice(0,4);document.getElementById("related").innerHTML=finalRel.map(relatedCard).join("");document.title=(product.name||"Product")+" | Nini Garments"}
async function load(){try{const id=new URLSearchParams(location.search).get("id");const r=await fetch(API_URL+"/api/products");const data=await r.json();products=data.products||[];product=products.find(x=>Number(x.id)===Number(id));if(!product){document.getElementById("app").innerHTML='<div class="error"><h2>Product not found</h2><a href="index.html#shop">Back to Shop</a></div>';return}const first=inStock(product)[0];selectedSize=first?.size||"";render();updateCounts()}catch(e){document.getElementById("app").innerHTML='<div class="error"><h2>Could not load product</h2><p>Please refresh and try again.</p></div>'}}
load();
</script>
<script src="nini-v2-ui.js"></script>
</body>
</html>
