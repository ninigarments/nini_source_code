<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Nini Garments | Product</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;overflow-x:hidden}
body{font-family:Arial,Helvetica,sans-serif;background:#f5f7fb;color:#172033}
button,input{font:inherit}
button{cursor:pointer}
a{text-decoration:none;color:inherit}
img{display:block;max-width:100%}

.header{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid #e5e9f0;padding:10px 5%;display:flex;align-items:center;gap:20px}
.logo{width:86px;height:52px;object-fit:contain}
.search{display:flex;flex:1;max-width:560px}
.search input{width:100%;height:42px;padding:0 13px;border:1px solid #d8deea;border-radius:7px 0 0 7px;outline:0}
.search button{border:0;background:#2167ed;color:#fff;padding:0 18px;border-radius:0 7px 7px 0;font-weight:700}
.nav{margin-left:auto;display:flex;gap:18px;align-items:center;white-space:nowrap}
.nav a,.nav button{border:0;background:none;font-weight:700;color:#172033}
.badge{background:#ff2d68;color:#fff;border-radius:999px;padding:2px 7px;font-size:11px}

.page{max-width:1200px;margin:0 auto;padding:18px}
.back{display:inline-block;color:#2167ed;font-weight:700;margin:0 0 14px}
.crumb{font-size:13px;color:#68748b;margin:0 0 14px}

.product-main{background:#fff;border-radius:14px;padding:18px;display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:26px;box-shadow:0 4px 18px rgba(0,0,0,.05)}

.gallery{min-width:0}
.gallery-main{position:relative;width:100%;aspect-ratio:1/1;background:#fff;border:1px solid #edf0f5;border-radius:10px;overflow:hidden}
.gallery-main img{width:100%;height:100%;object-fit:contain}
.arrow{position:absolute;top:50%;transform:translateY(-50%);width:38px;height:38px;border:0;border-radius:50%;background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.15);font-size:24px;z-index:2}
.arrow.left{left:10px}.arrow.right{right:10px}
.counter{position:absolute;right:10px;bottom:10px;background:rgba(23,32,51,.75);color:#fff;border-radius:14px;padding:4px 9px;font-size:12px}
.thumbs{display:flex;gap:8px;margin-top:9px;overflow-x:auto;padding:2px}
.thumb{flex:0 0 62px;width:62px;height:62px;border:1px solid #d8deea;border-radius:8px;background:#fff;overflow:hidden;padding:0}
.thumb.active{border:2px solid #2167ed}
.thumb img{width:100%;height:100%;object-fit:contain}

.info h1{font-size:28px;line-height:1.25;margin:0 0 10px}
.rating{display:inline-block;background:#147a3d;color:#fff;border-radius:6px;padding:6px 9px;font-weight:800;font-size:13px}
.muted{color:#68748b}
.price{font-size:31px;font-weight:900;margin:17px 0 7px}
.mrp{text-decoration:line-through;color:#788397;font-size:16px;font-weight:500;margin-left:9px}
.off{color:#16833b;font-size:15px;font-weight:800;margin-left:9px}
.meta{display:grid;grid-template-columns:110px 1fr;gap:8px;margin:15px 0;color:#4d596d}
.size-title{font-weight:800;margin:18px 0 9px}
.sizes{display:flex;flex-wrap:wrap;gap:8px}
.size-btn{background:#fff;border:1px solid #cbd3e0;border-radius:7px;padding:9px 12px;text-align:center}
.size-btn.active{border:2px solid #2167ed;background:#eef4ff}
.size-btn small{font-size:11px}
.stock-note{margin-top:8px;font-size:13px}
.qty{display:flex;align-items:center;gap:12px;margin:16px 0}
.qty button{width:38px;height:38px;border:1px solid #ccd4e2;background:#fff;border-radius:7px;font-size:20px}
.qty span{font-weight:800;min-width:25px;text-align:center}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{min-height:48px;border-radius:8px;font-weight:800;padding:10px;border:1px solid #2167ed}
.cart{background:#fff;color:#2167ed}.buy{background:#2167ed;color:#fff}
.wish{width:100%;margin-top:10px;padding:11px;background:#fff;border:1px solid #d7ddea;border-radius:8px;font-weight:800}

.section{background:#fff;border-radius:14px;padding:22px;margin-top:18px;box-shadow:0 4px 18px rgba(0,0,0,.05)}
.section h2{text-align:center;margin:0 0 14px}
.review-box{border:1px solid #e1e6ef;border-radius:10px;padding:18px;background:#fafbfc;text-align:center}
.related{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.card{border:1px solid #e1e6ef;border-radius:10px;overflow:hidden;background:#fff}
.card img{width:100%;aspect-ratio:1/1;object-fit:contain;background:#fff}
.card-body{padding:10px}.card h3{font-size:15px;margin:0 0 7px}.card-price{font-weight:900;font-size:17px}
.card del{font-size:12px;color:#7b8494;margin-left:5px}
.card button{margin-top:9px;width:100%;padding:9px;border:1px solid #2167ed;color:#2167ed;background:#fff;border-radius:7px;font-weight:700}
.loading{text-align:center;padding:70px;font-weight:700}.error{text-align:center;background:#fff;padding:40px;border-radius:14px}

@media(max-width:800px){
  .header{padding:8px 12px;gap:8px;flex-wrap:wrap}
  .logo{width:64px;height:42px}
  .nav{order:2;max-width:calc(100% - 72px);overflow-x:auto;gap:12px;font-size:12px}
  .search{order:3;flex:0 0 100%;max-width:none}
  .page{padding:0 0 78px}
  #app{width:100%;max-width:none;margin:0;padding:0;text-align:initial}
  .back{padding:10px 14px;margin:0;border-bottom:1px solid #eee;width:100%}
  .crumb{padding:9px 14px;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .product-main{display:block;padding:0;border-radius:0;box-shadow:none}
  .gallery-main{width:100%;height:auto;aspect-ratio:auto;border-radius:0;border-left:0;border-right:0}
  .gallery-main img{display:block;width:100%;height:auto;max-width:100%;object-fit:initial}
  .thumbs{padding:7px 10px;margin:0;border-bottom:1px solid #eee}
  .info{padding:14px}
  .info h1{font-size:20px}
  .price{font-size:28px}
  .meta{grid-template-columns:95px 1fr}
  .actions{position:fixed;left:0;right:0;bottom:0;z-index:50;background:#fff;padding:8px 10px calc(8px + env(safe-area-inset-bottom));border-top:1px solid #ddd;box-shadow:0 -2px 10px rgba(0,0,0,.08)}
  .section{border-radius:0;box-shadow:none;margin-top:8px;border-top:7px solid #f5f7fb;padding:15px 14px}
  .related{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
  .card h3{font-size:13px}
}
</style>
</head>
<body>
<header class="header">
  <a href="index.html#shop"><img class="logo" src="nini-logo.jpeg" alt="Nini Garments"></a>
  <div class="search"><input id="search" placeholder="Search products..."><button onclick="searchProducts()">Search</button></div>
  <nav class="nav">
    <a href="index.html#shop">Shop</a>
    <button onclick="openWishlist()">♡ Wishlist <span id="wishCount" class="badge">0</span></button>
    <a href="index.html#cart">🛒 Cart <span id="cartCount" class="badge">0</span></a>
    <a href="index.html#orders">My Orders</a>
  </nav>
</header>

<main class="page">
  <a class="back" href="index.html#shop">← Back to Shop</a>
  <div id="app" class="loading">Loading product...</div>
</main>

<script>
const API_URL="https://nini-api.msninigarments7368.workers.dev";
let products=[],product=null,selectedSize="",quantity=1,currentImage=0,galleryImages=[];
let wishlist=JSON.parse(localStorage.getItem("niniWishlist")||"[]");
let cart=JSON.parse(localStorage.getItem("niniCart")||"[]");

const esc=v=>String(v??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;");

function sizeRow(p,s){
  return Array.isArray(p.sizes)?p.sizes.find(x=>String(x.size)===String(s)):null;
}
function price(p,s){
  const x=sizeRow(p,s), sp=Number(x?.price||0), pp=Number(p?.price||0);
  return sp>0?sp:pp;
}
function mrp(p,s){
  const x=sizeRow(p,s), sm=Number(x?.mrp||0), pm=Number(p?.mrp||0), sp=price(p,s);
  return sm>0?sm:(pm>0?pm:sp);
}
function discount(p,s){const a=mrp(p,s),b=price(p,s);return a>b?Math.round((a-b)/a*100):0}
function inStock(p){return Array.isArray(p?.sizes)?p.sizes.filter(s=>Number(s.stock||0)>0):[]}
function lowest(p){
  const a=inStock(p).map(s=>price(p,s.size)).filter(x=>x>0);
  return a.length?Math.min(...a):Number(p?.price||0);
}
function updateCounts(){
  document.getElementById("wishCount").textContent=wishlist.length;
  document.getElementById("cartCount").textContent=cart.reduce((a,x)=>a+Number(x.quantity||0),0);
}
function saveCart(){localStorage.setItem("niniCart",JSON.stringify(cart))}
function toggleWish(){
  const id=Number(product.id);
  wishlist=wishlist.includes(id)?wishlist.filter(x=>x!==id):[...wishlist,id];
  localStorage.setItem("niniWishlist",JSON.stringify(wishlist));
  render();
  updateCounts();
}
function openWishlist(){window.location.href="index.html#shop"}
function searchProducts(){
  const q=document.getElementById("search").value.trim();
  window.location.href="index.html#shop"+(q?"?search="+encodeURIComponent(q):"");
}
function chooseSize(s){selectedSize=s;quantity=1;render()}
function changeQty(n){
  const s=sizeRow(product,selectedSize),max=Math.max(1,Number(s?.stock||1));
  quantity=Math.min(max,Math.max(1,quantity+n));
  const el=document.getElementById("qty");if(el)el.textContent=quantity;
}
function addCart(buyNow=false){
  if(!selectedSize){alert("Please select a size first.");return}
  const s=sizeRow(product,selectedSize);
  if(!s||Number(s.stock)<=0){alert("This size is out of stock.");return}
  const p=price(product,selectedSize),m=mrp(product,selectedSize),d=discount(product,selectedSize);
  const old=cart.find(x=>Number(x.id)===Number(product.id)&&String(x.size)===String(selectedSize));
  const existingQty=old?Number(old.quantity||0):0;
  if(existingQty+quantity>Number(s.stock)){alert("No more stock available for this size.");return}
  if(old){old.quantity=existingQty+quantity;old.price=p;old.mrp=m;old.discount=d}
  else cart.push({id:product.id,name:product.name,category:product.category,price:p,mrp:m,discount:d,size:selectedSize,quantity,image:product.image_front||product.image});
  saveCart();updateCounts();
  if(buyNow) window.location.href="index.html#cart";
  else alert(product.name+" added to cart.");
}
function setImage(i){
  if(!galleryImages.length)return;
  currentImage=(i+galleryImages.length)%galleryImages.length;
  const main=document.getElementById("mainImage");
  if(main)main.src=galleryImages[currentImage];
  document.querySelectorAll(".thumb").forEach((x,n)=>x.classList.toggle("active",n===currentImage));
  const c=document.getElementById("imageCounter");if(c)c.textContent=(currentImage+1)+" / "+galleryImages.length;
}
function moveImage(n){setImage(currentImage+n)}
function buildGallery(p){
  galleryImages=[p.image_front,p.image_back,p.image_additional,p.image_extra,p.image].filter(x=>String(x||"").trim());
  galleryImages=[...new Set(galleryImages)];
  if(!galleryImages.length)galleryImages=["nini-logo.jpeg"];
  currentImage=0;
}
function relatedCard(p){
  const ps=lowest(p),s=inStock(p)[0],m=s?mrp(p,s.size):Number(p.mrp||ps);
  const image=p.image_front||p.image||"nini-logo.jpeg";
  return `<div class="card"><img src="${esc(image)}" alt="${esc(p.name)}" onerror="this.src='nini-logo.jpeg'"><div class="card-body"><h3>${esc(p.name)}</h3><div class="card-price">₹${ps.toLocaleString("en-IN")}${m>ps?` <del>₹${m.toLocaleString("en-IN")}</del>`:""}</div><button onclick="location.href='product.html?id=${Number(p.id)}'">View Product</button></div></div>`;
}
function render(){
  if(!product)return;
  buildGallery(product);
  const sizes=inStock(product);
  const selected=sizeRow(product,selectedSize);
  const p=selected?price(product,selectedSize):lowest(product);
  const m=selected?mrp(product,selectedSize):(()=>{const a=sizes.map(x=>mrp(product,x.size)).filter(x=>x>0);return a.length?Math.min(...a):Number(product.mrp||p)})();
  const d=m>p?Math.round((m-p)/m*100):0;
  const wished=wishlist.includes(Number(product.id));

  const app=document.getElementById("app"); app.className=""; app.innerHTML=`
    <div class="crumb">Home / ${esc(product.category||"Products")} / ${esc(product.name)}</div>
    <section class="product-main">
      <div class="gallery">
        <div class="gallery-main">
          <img id="mainImage" src="${esc(galleryImages[0])}" alt="${esc(product.name)}" onerror="this.src='nini-logo.jpeg'">
          ${galleryImages.length>1?`<button class="arrow left" onclick="moveImage(-1)">‹</button><button class="arrow right" onclick="moveImage(1)">›</button>`:""}
          ${galleryImages.length>1?`<span class="counter" id="imageCounter">1 / ${galleryImages.length}</span>`:""}
        </div>
        ${galleryImages.length>1?`<div class="thumbs">${galleryImages.map((im,i)=>`<button class="thumb ${i===0?"active":""}" onclick="setImage(${i})"><img src="${esc(im)}" alt=""></button>`).join("")}</div>`:""}
      </div>

      <div class="info">
        <h1>${esc(product.name)}</h1>
        <div><span class="rating">⭐ 4.5 ★</span> <span class="muted">No reviews yet</span></div>
        <div class="price">₹${p.toLocaleString("en-IN")}${m>p?`<del class="mrp">₹${m.toLocaleString("en-IN")}</del><span class="off">${d}% OFF</span>`:""}</div>

        <div class="meta">
          ${product.category?`<div>Category</div><div>${esc(product.category)}</div>`:""}
          ${product.age_group?`<div>Age Group</div><div>${esc(product.age_group)}</div>`:""}
          ${product.sku?`<div>SKU</div><div>${esc(product.sku)}</div>`:""}
        </div>

        <div class="size-title">Select Size</div>
        <div class="sizes">
          ${sizes.length?sizes.map(x=>`<button class="size-btn ${String(x.size)===String(selectedSize)?"active":""}" onclick="chooseSize('${esc(x.size)}')">${esc(x.size)}<br><small>${Number(x.stock)} left</small></button>`).join(""):"<span class='muted'>Out of stock</span>"}
        </div>

        ${selected?`<div class="stock-note muted">✓ ${Number(selected.stock)} in stock · ₹${price(product,selectedSize).toLocaleString("en-IN")} for selected size</div>`:""}

        <div class="qty"><strong>Quantity</strong><button onclick="changeQty(-1)">−</button><span id="qty">${quantity}</span><button onclick="changeQty(1)">+</button></div>

        <div class="actions">
          <button class="btn cart" onclick="addCart(false)">🛒 Add to Cart</button>
          <button class="btn buy" onclick="addCart(true)">⚡ Buy Now</button>
        </div>

        <button class="wish" onclick="toggleWish()">${wished?"♥ Remove from Wishlist":"♡ Add to Wishlist"}</button>
      </div>
    </section>

    <section class="section">
      <h2>Product Details</h2>
      <p style="line-height:1.7;color:#4b5563">${product.description?esc(product.description):"Product description will be available soon."}</p>
      ${product.tags?`<p><strong>Tags:</strong> <span class="muted">${esc(product.tags)}</span></p>`:""}
    </section>

    <section class="section">
      <h2>Ratings & Reviews</h2>
      <div class="review-box"><strong>⭐ Customer Rating</strong><p class="muted">No customer reviews yet. Reviews will appear here after customers start reviewing this product.</p></div>
    </section>

    <section class="section">
      <h2>Related Products</h2>
      <div class="related" id="related"></div>
    </section>`;

  const rel=products.filter(x=>Number(x.id)!==Number(product.id)&&String(x.category||"").toLowerCase()===String(product.category||"").toLowerCase()).slice(0,4);
  const finalRel=rel.length?rel:products.filter(x=>Number(x.id)!==Number(product.id)).slice(0,4);
  document.getElementById("related").innerHTML=finalRel.map(relatedCard).join("");
  document.title=(product.name||"Product")+" | Nini Garments";
}
async function load(){
  const id=new URLSearchParams(location.search).get("id");

  // 1) Show the product immediately from the homepage cache.
  try{
    const cached=JSON.parse(
      localStorage.getItem("niniProductsCache") || "[]"
    );

    if(Array.isArray(cached) && cached.length){
      products=cached;
      product=products.find(
        x=>Number(x.id)===Number(id)
      );

      if(product){
        selectedSize="";
        quantity=1;
        render();
        updateCounts();
      }
    }
  }catch(cacheError){
    console.warn(
      "Nini product cache could not be read:",
      cacheError
    );
  }

  // 2) Refresh in the background so price/stock/images stay current.
  try{
    const r=await fetch(API_URL+"/api/products");
    if(!r.ok)throw new Error("Product API request failed");

    const data=await r.json();
    const freshProducts=
      Array.isArray(data.products)
        ? data.products
        : [];

    try{
      localStorage.setItem(
        "niniProductsCache",
        JSON.stringify(freshProducts)
      );
    }catch(cacheError){
      console.warn(
        "Nini product cache could not be refreshed:",
        cacheError
      );
    }

    products=freshProducts;

    const freshProduct=products.find(
      x=>Number(x.id)===Number(id)
    );

    if(freshProduct){
      const hadProduct=!!product;
      product=freshProduct;

      if(!hadProduct){
        selectedSize="";
        quantity=1;
      }

      render();
      updateCounts();
    }else if(!product){
      document.getElementById("app").innerHTML=
        '<div class="error"><h2>Product not found</h2><a href="index.html#shop">Back to Shop</a></div>';
    }
  }catch(e){
    // If cached product was already shown, keep showing it.
    if(!product){
      document.getElementById("app").innerHTML=
        '<div class="error"><h2>Could not load product</h2><p>Please refresh and try again.</p></div>';
    }
  }
}
document.addEventListener("touchstart",e=>{
  if(!e.target.closest(".gallery-main"))return;
  window._sx=e.touches[0].clientX;window._sy=e.touches[0].clientY;
},{passive:true});
document.addEventListener("touchend",e=>{
  if(!e.target.closest(".gallery-main")||window._sx===undefined)return;
  const dx=e.changedTouches[0].clientX-window._sx,dy=e.changedTouches[0].clientY-window._sy;
  if(Math.abs(dx)>50&&Math.abs(dx)>Math.abs(dy))moveImage(dx<0?1:-1);
  window._sx=undefined;window._sy=undefined;
},{passive:true});
load();
</script>
</body>
</html>
