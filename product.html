<body>
<header class="header">
  <a href="index.html#shop"><img class="logo" src="nini-logo.jpeg" alt="Nini Garments"></a>
  <div class="search"><input id="search" placeholder="Search products..."><button onclick="searchProducts()">Search</button></div>
  <nav class="nav"><a href="index.html#shop">Shop</a><button onclick="openWishlist()">♡ Wishlist <span id="wishCount" class="badge">0</span></button><a href="index.html#cart">🛒 Cart <span id="cartCount" class="badge">0</span></a><a href="index.html#orders">My Orders</a></nav>
</header>
<main class="page"><a class="back" href="index.html#shop">← Back to Shop</a><div id="app" class="loading">Loading product...</div></main>
<script>
const API_URL="https://nini-api.msninigarments7368.workers.dev";
let products=[];let product=null;let selectedSize="";let quantity=1;
let wishlist=JSON.parse(localStorage.getItem("niniWishlist")||"[]");
let cart=JSON.parse(localStorage.getItem("niniCart")||"[]");
const esc=v=>String(v??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;");
function price(p,s){
  const x=Array.isArray(p?.sizes)
    ? p.sizes.find(v=>String(v.size)===String(s))
    : null;
  const sizePrice=Number(x?.price||0);
  const productPrice=Number(p?.price||0);
  return sizePrice>0 ? sizePrice : productPrice;
}
function mrp(p,s){
  const x=Array.isArray(p?.sizes)
    ? p.sizes.find(v=>String(v.size)===String(s))
    : null;
  const sizeMrp=Number(x?.mrp||0);
  const productMrp=Number(p?.mrp||0);
  const sellingPrice=price(p,s);
  return sizeMrp>0 ? sizeMrp : (productMrp>0 ? productMrp : sellingPrice);
}
function discount(p,s){const a=mrp(p,s),b=price(p,s);return a>b?Math.round((a-b)/a*100):0}
function inStock(p){return (p.sizes||[]).filter(s=>Number(s.stock||0)>0)}
function lowest(p){
  const a=inStock(p).map(s=>price(p,s.size)).filter(x=>x>0);
  return a.length ? Math.min(...a) : Number(p?.price||0);
}
function updateCounts(){document.getElementById("wishCount").textContent=wishlist.length;document.getElementById("cartCount").textContent=cart.reduce((a,x)=>a+Number(x.quantity||0),0)}
let galleryImages=[];let galleryIndex=0;
function getProductImages(p){
  if(!p)return[];
  const raw=[p.image_front,p.image_back,p.image_additional,p.image_extra,p.image];
  const seen=new Set();
  return raw.map(v=>String(v||"").trim()).filter(v=>v && !seen.has(v) && seen.add(v));
}
function setGalleryImage(index){
  if(!galleryImages.length)return;
  galleryIndex=(index+galleryImages.length)%galleryImages.length;
  const main=document.getElementById("galleryMainImage");
  if(main){
    main.src=galleryImages[galleryIndex];
    main.onerror=function(){this.src="nini-logo.jpeg"};
  }
  document.querySelectorAll(".gallery-thumb").forEach((el,i)=>el.classList.toggle("active",i===galleryIndex));
  const counter=document.getElementById("galleryCounter");
  if(counter)counter.textContent=(galleryIndex+1)+" / "+galleryImages.length;
}
function changeGallery(step){setGalleryImage(galleryIndex+step)}
function selectGalleryImage(index){setGalleryImage(index)}

let galleryTouchStartX=0;
let galleryTouchStartY=0;
document.addEventListener("touchstart",function(e){
  const box=e.target.closest(".gallery-main");
  if(!box)return;
  galleryTouchStartX=e.touches[0].clientX;
  galleryTouchStartY=e.touches[0].clientY;
},{passive:true});

document.addEventListener("touchend",function(e){
  const box=e.target.closest(".gallery-main");
  if(!box || galleryImages.length<2)return;
  const dx=e.changedTouches[0].clientX-galleryTouchStartX;
  const dy=e.changedTouches[0].clientY-galleryTouchStartY;
  if(Math.abs(dx)>50 && Math.abs(dx)>Math.abs(dy)){
    changeGallery(dx<0?1:-1);
  }
},{passive:true});

function toggleWish(){const id=Number(product.id);if(wishlist.includes(id))wishlist=wishlist.filter(x=>x!==id);else wishlist.push(id);localStorage.setItem("niniWishlist",JSON.stringify(wishlist));render();updateCounts()}
function openWishlist(){alert("Wishlist is available on the Shop page. Your saved products are preserved.");}
function chooseSize(s){selectedSize=s;quantity=1;render();}
function changeQty(n){const s=product?.sizes?.find(x=>String(x.size)===String(selectedSize));const max=Number(s?.stock||1);quantity=Math.min(max,Math.max(1,quantity+n));document.getElementById("qty").textContent=quantity}
function addCart(buyNow=false){if(!selectedSize){alert("Please select a size first.");return}const s=product.sizes.find(x=>String(x.size)===String(selectedSize));if(!s||Number(s.stock)<=0){alert("This size is out of stock.");return}const p=price(product,selectedSize),m=mrp(product,selectedSize),d=discount(product,selectedSize);const old=cart.find(x=>Number(x.id)===Number(product.id)&&String(x.size)===String(selectedSize));if(old){if(Number(old.quantity)+quantity>Number(s.stock)){alert("No more stock available for this size.");return}old.quantity+=quantity;old.price=p;old.mrp=m;old.discount=d}else cart.push({id:product.id,name:product.name,category:product.category,price:p,mrp:m,discount:d,size:selectedSize,quantity,image:(product.image_front||product.image||"")});localStorage.setItem("niniCart",JSON.stringify(cart));updateCounts();if(buyNow){window.location.href="index.html#cart"}else alert(product.name+" added to cart.")}
function searchProducts(){const q=document.getElementById("search").value.trim();window.location.href="index.html#shop"+(q?"?search="+encodeURIComponent(q):"")}
function relatedCard(p){const ps=lowest(p),ss=inStock(p);const size=ss[0]?.size||"";return `<div class="card"><img src="${esc(p.image_front||p.image||"nini-logo.jpeg")}" alt="${esc(p.name)}" onerror="this.src='nini-logo.jpeg'"><div class="card-body"><h3>${esc(p.name)}</h3><div class="card-price">₹${ps.toLocaleString("en-IN")}${size&&mrp(p,size)>ps?` <del>₹${mrp(p,size).toLocaleString("en-IN")}</del>`:""}</div><button onclick="window.location.href='product.html?id=${Number(p.id)}'">View Product</button></div></div>`}
function render(){
  if(!product)return;
  galleryImages=getProductImages(product);
  if(!galleryImages.length)galleryImages=["nini-logo.jpeg"];
  if(galleryIndex>=galleryImages.length)galleryIndex=0;

  const sizes=inStock(product);
  const has=!!selectedSize;
  const s=sizes.find(x=>String(x.size)===String(selectedSize));
  const p=has?price(product,selectedSize):lowest(product);
  const m=has?mrp(product,selectedSize):(()=>{
    const vals=sizes.map(x=>mrp(product,x.size)).filter(x=>x>0);
    return vals.length?Math.min(...vals):Number(product.mrp||p)
  })();
  const d=m>p?Math.round((m-p)/m*100):0;
  const wished=wishlist.includes(Number(product.id));

  const thumbnails=galleryImages.map((img,i)=>`
    <button type="button" class="gallery-thumb ${i===galleryIndex?"active":""}" onclick="selectGalleryImage(${i})" aria-label="View image ${i+1}">
      <img src="${esc(img)}" alt="${esc(product.name)} image ${i+1}" onerror="this.src='nini-logo.jpeg'">
    </button>
  `).join("");

  const galleryControls=galleryImages.length>1?`
    <button type="button" class="gallery-arrow prev" onclick="changeGallery(-1)" aria-label="Previous image">‹</button>
    <button type="button" class="gallery-arrow next" onclick="changeGallery(1)" aria-label="Next image">›</button>
    <span class="gallery-counter" id="galleryCounter">${galleryIndex+1} / ${galleryImages.length}</span>
  `:"";

  document.getElementById("app").innerHTML=`
    <div class="crumb">Home / ${esc(product.category||"Products")} / ${esc(product.name)}</div>
    <section class="product-main">
      <div class="gallery">
        <div class="gallery-thumbs">${thumbnails}</div>
        <div class="gallery-main">
          <img id="galleryMainImage" src="${esc(galleryImages[galleryIndex])}" alt="${esc(product.name)}" onerror="this.src='nini-logo.jpeg'">
          ${galleryControls}
        </div>
      </div>

      <div class="info">
        <h1>${esc(product.name)}</h1>
        <div><span class="rating">⭐ 4.5 ★</span> <span class="muted">No reviews yet</span></div>
        <div class="price">₹${p.toLocaleString("en-IN")}${m>p?`<del class="mrp">₹${m.toLocaleString("en-IN")}</del><span class="off">${d}% OFF</span>`:""}</div>
        <div class="meta">
          ${product.category?`<div>Category</div><div>${esc(product.category)}</div>`:""}
          ${product.age_group?`<div>Age Group</div><div>${esc(product.age_group)}</div>`:""}
          ${product.sku?`<div>SKU</div><div>${esc(product.sku)}</div>`:""}
        </div>

        <div class="size-title">Select Size</div>
        <div class="sizes">${sizes.length?sizes.map(x=>`
          <button class="size-btn ${String(x.size)===String(selectedSize)?"active":""}" onclick="chooseSize('${esc(x.size)}')">
            ${esc(x.size)}<br><small>${Number(x.stock)} left</small>
          </button>`).join(""):"<span class='muted'>Out of stock</span>"}
        </div>

        ${s?`<div class="muted" style="margin-top:8px">✓ ${Number(s.stock)} in stock · ₹${price(product,selectedSize).toLocaleString("en-IN")} for selected size</div>`:""}

        <div class="qty"><strong>Quantity</strong><button onclick="changeQty(-1)">−</button><span id="qty">${quantity}</span><button onclick="changeQty(1)">+</button></div>
        <div class="actions"><button class="btn cart" onclick="addCart(false)">🛒 Add to Cart</button><button class="btn buy" onclick="addCart(true)">⚡ Buy Now</button></div>
        <button class="wish" onclick="toggleWish()">${wished?"♥ Remove from Wishlist":"♡ Add to Wishlist"}</button>
      </div>
    </section>

    <section class="section">
      <h2>Product Details</h2>
      <p style="line-height:1.75;color:#4b5563">${product.description?esc(product.description):"Product description will be available soon."}</p>
      ${product.tags?`<p><strong>Tags:</strong> <span class="muted">${esc(product.tags)}</span></p>`:""}
    </section>

    <section class="section">
      <h2>Ratings & Reviews</h2>
      <div class="review-box"><strong>⭐ Customer Rating</strong><p class="muted">No customer reviews yet. Reviews will appear here after customers start reviewing this product.</p></div>
    </section>

    <section class="section">
      <h2>Related Products</h2>
      <div class="related" id="related"></div>
    </section>
  `;

  setGalleryImage(galleryIndex);

  const rel=products.filter(x=>Number(x.id)!==Number(product.id)&&String(x.category||"").toLowerCase()===String(product.category||"").toLowerCase()).slice(0,4);
  const finalRel=rel.length?rel:products.filter(x=>Number(x.id)!==Number(product.id)).slice(0,4);
  document.getElementById("related").innerHTML=finalRel.map(relatedCard).join("");
  document.title=(product.name||"Product")+" | Nini Garments";
}
document.addEventListener("keydown",function(e){
  if(!galleryImages.length)return;
  if(e.key==="ArrowLeft")changeGallery(-1);
  if(e.key==="ArrowRight")changeGallery(1);
});

async function load(){try{const id=new URLSearchParams(location.search).get("id");const r=await fetch(API_URL+"/api/products");const data=await r.json();products=data.products||[];product=products.find(x=>Number(x.id)===Number(id));if(!product){document.getElementById("app").innerHTML='<div class="error"><h2>Product not found</h2><a href="index.html#shop">Back to Shop</a></div>';return}selectedSize="";quantity=1;render();updateCounts()}catch(e){document.getElementById("app").innerHTML='<div class="error"><h2>Could not load product</h2><p>Please refresh and try again.</p></div>'}}
load();
</script>
</body>
</html>
