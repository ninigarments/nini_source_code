<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="Nini Garments - 0 to 6 Years Kids Wear">

  <title>Nini Garments | 0–6 Years Kids Wear</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: "Nunito", sans-serif;
      background: #ffffff;
      color: #202124;
      padding-bottom: 78px;
    }

    button,
    a,
    select {
      font-family: inherit;
    }

    button {
      cursor: pointer;
    }

    a {
      text-decoration: none;
      color: inherit;
    }

    /* =========================
       TOP HEADER
    ========================= */

    .mobile-header {
      position: sticky;
      top: 0;
      z-index: 1000;
      background: rgba(255,255,255,.97);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid #f1f1f1;
    }

    .header-main {
      height: 76px;
      display: grid;
      grid-template-columns: 48px 1fr 48px 48px;
      align-items: center;
      gap: 4px;
      padding: 6px 12px;
    }

    .icon-btn {
      width: 44px;
      height: 44px;
      border: 0;
      background: transparent;
      border-radius: 50%;
      display: grid;
      place-items: center;
      font-size: 23px;
      color: #222;
    }

    .icon-btn:active {
      background: #f7f7f7;
    }

    .brand {
      text-align: center;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .brand img {
      width: 116px;
      height: auto;
      max-height: 64px;
      object-fit: contain;
    }

    .cart-button {
      position: relative;
    }

    .cart-badge {
      position: absolute;
      top: 1px;
      right: 0;
      min-width: 20px;
      height: 20px;
      padding: 0 5px;
      border-radius: 20px;
      background: #f23b72;
      color: white;
      font-size: 11px;
      font-weight: 900;
      display: grid;
      place-items: center;
    }

    .brand-tagline {
      text-align: center;
      font-size: 9px;
      font-weight: 800;
      letter-spacing: 2px;
      color: #2381c4;
      margin-top: -3px;
      padding-bottom: 7px;
    }

       HERO
